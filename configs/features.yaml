# Feature Engineering Configuration for Aarohan
# Initial settings defined in the approved project blueprint

forecast_horizon_days: 7

lags:
  - 1
  - 2
  - 3
  - 7
  - 14
  - 28

rolling_mean_windows:
  - 7
  - 14
  - 28

rolling_std_windows:
  - 7
  - 14
  - 28

# Known future calendar features (deterministic, known in advance for any horizon)
known_calendar_features:
  - "day_of_week"
  - "is_weekend"
  - "holiday_flag"

# Conditional future covariates (permissible only when verified known at forecast origin)
conditional_future_covariates:
  activity_flag:
    description: "Promotional marketing flag; include only when promotion schedule is known at forecast origin"
    enabled: false
  discount:
    description: "Promotional discount rate; include only when pricing plan is committed at forecast origin"
    enabled: false
  weather:
    description: "Weather covariates; include only when a genuine forecast snapshot is available at forecast origin"
    enabled: false
    variables:
      - "precpt"
      - "avg_temperature"
      - "avg_humidity"
      - "avg_wind_level"

leakage_safeguards:
  shift_rolling_windows: true
  min_historical_days: 28
